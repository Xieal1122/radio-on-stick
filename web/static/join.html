<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070a12">
  <title>加入电台</title>
  <style>
    :root { color-scheme: dark; --bg:#070a12; --panel:#111722; --line:#273244; --text:#f4f7ff; --muted:#8d9ab0; --accent:#7ee7c7; --danger:#ff9292; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 20% 0%,#1a2940,transparent 45%),var(--bg); color:var(--text); font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(460px,100%); padding:30px; border:1px solid var(--line); border-radius:24px; background:linear-gradient(145deg,rgba(255,255,255,.06),transparent 38%),var(--panel); box-shadow:0 30px 100px rgba(0,0,0,.55); }
    .kicker { margin:0 0 8px; color:var(--accent); font-size:10px; font-weight:800; letter-spacing:.18em; }
    h1 { margin:0; font-size:30px; letter-spacing:-.04em; }
    p { color:var(--muted); }
    form { display:flex; gap:8px; margin-top:22px; }
    input { flex:1; min-width:0; padding:13px 15px; border:1px solid var(--line); border-radius:13px; background:#0a0f18; color:var(--text); font:inherit; text-transform:uppercase; letter-spacing:.08em; }
    input:focus { outline:2px solid rgba(126,231,199,.35); border-color:var(--accent); }
    button { padding:13px 20px; border:0; border-radius:13px; background:var(--accent); color:#06110e; font:inherit; font-weight:800; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    #status { min-height:24px; margin:12px 0 0; font-size:12px; }
    #status[data-tone="error"] { color:var(--danger); }
    .note { margin-top:20px; padding:12px 14px; border:1px solid var(--line); border-radius:12px; font-size:12px; color:var(--muted); }
    @media (max-width:480px) { main { padding:22px; } form { flex-direction:column; } }
  </style>
</head>
<body>
  <main>
    <p class="kicker">RADIO STATION</p>
    <h1>加入电台</h1>
    <p>输入邀请码进入这个电台。</p>
    <form id="joinForm" autocomplete="off">
      <input id="code" maxlength="200" placeholder="邀请码，可粘贴整句" aria-label="邀请码" required>
      <button id="submit" type="submit">加入</button>
    </form>
    <p id="status" role="status"></p>
    <p class="note">邀请码由电台管理员提供。管理员 token 不会出现在邀请链接里。</p>
  </main>
  <script src="/join.js?v=2"></script>
</body>
</html>
