<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Colorful abstract album art">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a5b"/>
      <stop offset="0.28" stop-color="#ff5fa2"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="0.78" stop-color="#22b8ff"/>
      <stop offset="1" stop-color="#f8e15b"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff9c4" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffcf4a" stop-opacity=".12"/>
    </radialGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="0.5" stop-color="#ffe9a8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9f8ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".15"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="610" cy="180" r="210" fill="url(#sun)"/>
  <circle cx="610" cy="180" r="92" fill="#fff6bd" opacity=".92"/>
  <circle cx="170" cy="610" r="150" fill="#3ee7d0" opacity=".38" filter="url(#soft)"/>
  <circle cx="700" cy="690" r="135" fill="#ff4d9d" opacity=".35" filter="url(#soft)"/>
  <path d="M-40 610 C120 470 250 720 420 560 S690 420 850 550" fill="none" stroke="url(#waveA)" stroke-width="26" stroke-linecap="round"/>
  <path d="M-60 690 C130 540 250 760 430 630 S700 500 860 600" fill="none" stroke="url(#waveB)" stroke-width="14" stroke-linecap="round" opacity=".85"/>
  <path d="M60 190 C180 100 280 260 390 160 S600 70 730 150" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity=".42"/>
  <g fill="#fff" opacity=".52">
    <circle cx="120" cy="170" r="9"/><circle cx="600" cy="420" r="7"/><circle cx="740" cy="310" r="12"/>
    <circle cx="330" cy="730" r="8"/><circle cx="490" cy="90" r="6"/><circle cx="80" cy="470" r="5"/>
